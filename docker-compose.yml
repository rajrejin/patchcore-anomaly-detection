services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/artifacts:ro
    environment:
      MVI_API__CONCURRENCY: "1"
      MVI_API__LRU_CATEGORIES: "2"
    mem_limit: 3g
    cpus: 4
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./results:/results:ro
      - ./data/mvtec_ad:/data/mvtec_ad:ro
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
      - /home/app/.streamlit
    restart: unless-stopped
