name: ci
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      # The integration tests need one real category and its trained model. Bottle (about
      # 150 MB) is downloaded from the official MVTec link and cached between runs; without it
      # those tests skip and coverage would fall below the 80 percent limit.
      - name: Cache bottle data and ImageNet weights
        uses: actions/cache@v4
        with:
          path: |
            data/mvtec_ad/bottle
            data/downloads.json
            ~/.cache/torch
          key: mvtec-bottle-v1
      - name: Fetch and train bottle
        run: |
          mvinspect fetch-data bottle
          mvinspect train bottle
      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t mvtec-api .
      - name: Build app image
        run: docker build -f docker/Dockerfile.app -t mvtec-app .
